<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abertura de chamados</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Abertura de chamados simplificada</h1>
        <form id="passwordChangeForm">
            <div class="form-group">
                <label for="system">Selecione o tipo de atendimento</label>
                <select id="system" name="system">
                    <option value="QE2">Qualidade</option>  <!-- Preencher os valores para PRD e QA, valor passado para api -->
                    <option value="PE2">Produção</option>
                </select>
            </div>
            <div class="form-group">
                <label for="username">Usuário de rede</label>
                <input type="text" id="username" name="username" placeholder="Insira o usuário">
            </div>
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="Insira o CPF" maxlength="11">
            </div>
            <div class="form-group">
                <label for="birthdate">Data de Nascimento</label>
                <input type="date" id="birthdate" name="birthdate">
            </div>
            <button type="button" id="submitBtn">Alterar Senha</button>
        </form>
        <div id="responseMessage"></div> <!-- Elemento para exibir a resposta -->
    </div>

    <!-- Popup para carregamento e resposta -->
    <div class="popup-overlay" id="popup">
        <div class="popup-content">
            <div class="loader" id="loader"></div>
            <div class="message" id="popupMessage">Aguardando resposta...</div>
            <button id="closePopupBtn">Fechar</button> <!-- Botão para fechar o popup -->
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
